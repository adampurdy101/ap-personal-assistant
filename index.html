<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP Personal Assistant</title>
  <meta name="theme-color" content="#f3f3f1">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&family=Roboto+Condensed:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/app.css?v=43">
</head>
<body>

  <!-- LOGIN -->
  <section id="login-screen" class="login hidden">
    <form id="login-form" class="login-card">
      <h1>Personal Assistant</h1>
      <p class="sub">Your organizer. Private to you.</p>
      <label>Email <input id="login-email" type="email" autocomplete="username" required></label>
      <label>Password <input id="login-password" type="password" autocomplete="current-password" required></label>
      <button id="login-submit" type="submit" class="btn primary">Sign in</button>
      <p id="login-msg" class="msg"></p>
    </form>
  </section>

  <!-- APP -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <span class="plate" title="Personal Assistant"><span class="mono">AP</span><b>PERSONAL ASSISTANT</b></span>

      <div class="seg" id="bucket-seg" role="group" aria-label="Calendar">
        <button data-bucket="work" class="on">Work</button>
        <button data-bucket="home">Home</button>
        <button data-bucket="both">Both</button>
      </div>

      <div class="seg" id="view-seg" role="group" aria-label="View">
        <button data-view="month" class="on">Month</button>
        <button data-view="week">Week</button>
        <button data-view="day">Day</button>
      </div>

      <form id="quick-add" class="quick" autocomplete="off">
        <span class="plus" aria-hidden="true">+</span>
        <input id="quick-input" type="text" placeholder="Quick add (Enter) — or type anything and press Assistant">
      </form>
      <button type="button" id="tell-btn" class="btn" title="Press and talk. Typed something in the box? Sends it."><svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg><span>Assistant</span></button>

      <button id="add-btn" class="btn" title="Add a task for today, tomorrow or any day">Add task</button>
      <button id="full-btn" class="btn" title="Full screen">Full screen</button>
      <button id="alerts-btn" class="btn ghost sm" title="Desktop pop-ups for meetings and nags">Alerts: off</button>
      <button id="install-btn" class="btn sm hidden" title="Run it in its own window">⬇ Install app</button>
      <button id="logout-btn" class="btn ghost sm" title="Sign out">Sign out</button>
      <span class="ver" title="App version — tell Claude this number if the look seems stale">v43</span>
    </header>

    <main class="layout" id="layout">
      <aside class="panel" id="rail">
        <div id="rail-body"></div>
      </aside>

      <section class="cal" id="cal">
        <div class="cal-head">
          <button id="prev-btn" class="btn" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"/></svg></button>
          <h2 id="cal-title">November 2026</h2>
          <button id="next-btn" class="btn" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 16 12 9 19"/></svg></button>
          <button id="today-btn" class="btn">Today</button>
          <button id="balance-btn" class="btn" title="Apply the scheduling rules to this week: move overflow with reasons, keep promises and drop-deads. Undo in the panel.">⇄ Balance week</button>
          <span class="legend" aria-label="Legend">
            <span class="hl urg">!! Urgent</span>
            <span class="hl high">▲ High</span>
            <span class="hl norm">● Normal</span>
            <span class="hl low">– Low</span>
            <span class="hl plan">◇ Planned</span>
            <span class="hl meet" title="Meeting you go to — counts against your 8 h day">■ Meeting</span>
            <span class="hl off" title="Holiday or PTO — no work goes here">◇ Off</span>
          </span>
        </div>
        <div id="cal-body" class="cal-body"></div>
      </section>
    </main>

    <div id="mini-root" class="miniwin hidden"></div>
    <div id="toast" class="toast hidden"></div>
  </div>

  <script type="module" src="js/app.js?v=43"></script>
</body>
</html>
